# Live checks of a message added while a session works, and the re-check a
# move of CLAUDE_VERSION waits for, laid over compose.wanda.yaml in a project
# of their own, so that the household's vault, run store, home directory,
# transcripts, image and Slack app are left alone. The name below takes the
# place of compose.wanda.yaml's even when -p is left out, so the vault and the
# run store are this project's own named volumes, wanda-foldin-check_vault and
# wanda-foldin-check_store, the only ones `down -v` here can remove; the home
# directory and the transcripts are a directory of its own; and the image is
# its own, so a re-check's build never retags the household's. Whatever .env
# says, it runs no morning look, and one session at a time, since a check has
# one session wait for another's to end; and no email triage, even once
# compose.wanda.yaml turns it on. Its clock still gives a timed reminder asked
# for here at its time, while this runs. It runs as a Slack app of its own,
# wanda-scratch (slack/manifest-scratch.yaml), and will not start without that
# app's two tokens and its alerts channel, a private one holding only fan and
# wanda-scratch. It connects only with the values set for wanda-scratch, so it
# never takes wanda's connection from her own variables: the household runs on
# meanwhile, and what is said to wanda-scratch reaches this vault alone, is
# not remembered, and stays in conversations no household session reads. Only
# one daemon may hold an app's connection, so one scratch at a time runs on
# wanda-scratch.
# From the household's worktree:
#
#   mkdir -p ~/wanda-foldin-check/transcripts
#   docker compose -p wanda-foldin-check -f compose.wanda.yaml -f compose.foldin-check.yaml build --build-arg CLAUDE_VERSION=<the version checked>
#       a re-check only
#   docker compose -p wanda-foldin-check -f compose.wanda.yaml -f compose.foldin-check.yaml up -d
#   ... the checks; then
#   docker compose -p wanda-foldin-check -f compose.wanda.yaml -f compose.foldin-check.yaml down -v --rmi all
#   rm -rf ~/wanda-foldin-check
name: wanda-foldin-check
services:
  wanda:
    image: wanda-foldin-check
    environment:
      # wanda-scratch's, in place of wanda's (compose.wanda.yaml): unset or
      # empty, the scratch does not start
      WANDA_SLACK_BOT_TOKEN: ${WANDA_SCRATCH_SLACK_BOT_TOKEN:?set it in .env, to wanda-scratch's bot token, as slack/manifest-scratch.yaml says}
      WANDA_SLACK_APP_TOKEN: ${WANDA_SCRATCH_SLACK_APP_TOKEN:?set it in .env, to wanda-scratch's app-level token, as slack/manifest-scratch.yaml says}
      WANDA_ALERT_CHANNEL: ${WANDA_SCRATCH_ALERT_CHANNEL:?set it in .env, to the id of the private channel holding only fan and wanda-scratch, for its alerts}
      WANDA_MORNINGS: ""
      WANDA_MEMORY_SESSIONS: "1"
      WANDA_EMAIL_TRIAGE: "off"
    volumes:
      - type: bind
        source: ~/wanda-foldin-check
        target: /srv/wanda/home
        bind:
          create_host_path: false
      - type: bind
        source: ~/wanda-foldin-check/transcripts
        target: /home/wanda/.claude/projects
        bind:
          create_host_path: false
