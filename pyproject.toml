[project]
name = "wanda"
version = "0.1.0"
description = "Wiki-Augmented Nodal Digital Assistant — event harness spawning headless claude -p sessions"
requires-python = ">=3.12"
dependencies = [
    "certifi>=2024.2.2",
    "imapclient>=3.0",
    "slack-sdk>=3.31",
    "pydantic>=2.7",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",  # read directly by config.legacy_env_names_in_use
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
wanda = "wanda.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Only the package. prompts/ and skills/ stay in the checkout and are read from
# the repo root at runtime (main.PROMPTS_DIR/SKILLS_DIR, passes.PROMPTS_DIR), so
# wanda runs from a clone — see README Setup.
packages = ["wanda"]
