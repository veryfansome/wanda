[project]
name = "wanda"
version = "0.1.0"
description = "Wiki-Augmented Nodal Digital Assistant — event harness spawning headless claude -p sessions"
requires-python = ">=3.12"
dependencies = [
    "certifi>=2024.2.2",
    "imapclient>=3.0",
    "slack-sdk>=3.31",
    "pydantic>=2.7",
    "pydantic-settings>=2.6",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
wanda = "wanda.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wanda"]
